name: Build-GeoSite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Prepare Release Environment
        run: |
          echo "RELEASE_DATE=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Build geosite.dat
        run: |
          go install github.com/v2fly/domain-list-community@latest
          $(go env GOPATH)/bin/domain-list-community --datapath=./data
          if [ -f "dlc.dat" ]; then
            mv dlc.dat geosite.dat
            echo "SUCCESS: geosite.dat created"
          else
            echo "ERROR: dlc.dat not created"
            exit 1
          fi

      - name: Generate Checksum
        run: sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Clean Old Release
        run: |
          gh release delete latest --yes || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GeoSite Build: ${{ env.RELEASE_DATE }}"
          body: |
            Собрано с помощью domain-list-community.
            Дата сборки: ${{ env.RELEASE_DATE }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            geosite.dat
            geosite.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
