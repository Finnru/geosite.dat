name: Build-GeoSite-Official-v2dat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Build geosite.dat via v2dat
        run: |
          # Собираем geosite.dat. 
          # Мы указываем флаг -f для принудительного задания имени выходного файла
          v2dat pack geosite -o ./geosite.dat data
          
          # Проверяем, создался ли файл, чтобы не упасть на следующем шаге
          if [ ! -f "geosite.dat" ]; then
            echo "❌ Ошибка: v2dat не создал geosite.dat!"
            ls -la
            exit 1
          fi

      - name: Generate Checksum
        run: sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Create Release
        run: |
          echo "RELEASE_DATE=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          gh release delete latest --yes || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          gh release create latest geosite.dat geosite.dat.sha256sum \
            --title "GeoSite Build: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" \
            --notes "Собрано через v2dat 1:1. Категории: $(ls data | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
