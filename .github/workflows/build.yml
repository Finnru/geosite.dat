name: Build-GeoSite-Official-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Generator
        run: go install v2ray.com/core/infra/control/main/command@latest

      - name: Build geosite.dat
        run: |
          # Устанавливаем официальный компилятор доменов
          go install github.com/v2fly/domain-list-community@latest
          
          # Запускаем сборку:
          # --datapath указывает на папку с вашими категориями (data)
          # Опция export-lists не нужна, нам нужен только бинарник
          domain-list-community --datapath=./data
          
          # По умолчанию утилита создает файл dlc.dat в папке пуска
          # Переименовываем его в нужный нам geosite.dat
          if [ -f "dlc.dat" ]; then
            mv dlc.dat geosite.dat
            echo "✅ geosite.dat успешно собран"
          else
            echo "❌ Ошибка: dlc.dat не был создан!"
            ls -R
            exit 1
          fi

      - name: Generate Checksum
        run: sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Create Release
        run: |
          echo "RELEASE_DATE=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          gh release delete latest --yes || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          gh release create latest geosite.dat geosite.dat.sha256sum \
            --title "GeoSite Build: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" \
            --notes "Бинарный файл собран из папки data при помощи официального компилятора v2fly."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
