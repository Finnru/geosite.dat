name: Build-GeoSite-Official-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build geosite.dat
        run: |
          # 1. Устанавливаем официальный компилятор
          go install github.com/v2fly/domain-list-community@latest
          
          # 2. Собираем файл. 
          # Компилятор ищет файлы в директории, указанной в --datapath
          # По умолчанию он сохраняет результат в файл dlc.dat
          $(go env GOPATH)/bin/domain-list-community --datapath=./data
          
          # 3. Проверяем и переименовываем
          if [ -f "dlc.dat" ]; then
            mv dlc.dat geosite.dat
            echo "✅ geosite.dat успешно собран"
          else
            echo "❌ Ошибка: dlc.dat не был создан!"
            ls -R
            exit 1
          fi

      - name: Generate Checksum
        run: sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Create Release
        run: |
          echo "RELEASE_DATE=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          gh release delete latest --yes || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          gh release create latest geosite.dat geosite.dat.sha256sum \
            --title "GeoSite Build: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" \
            --notes "Бинарный файл собран из папки data при помощи официального компилятора v2fly (domain-list-community)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
